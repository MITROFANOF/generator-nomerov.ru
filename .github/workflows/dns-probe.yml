name: dns-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          for d in generator-nomerov.ru mitrofanof.ru; do
            for ns in ns1.reg.ru ns2.reg.ru 8.8.8.8 1.1.1.1; do
              for t in A CAA; do
                echo "== $d $t @$ns"; dig +time=5 +tries=2 @$ns $d $t | grep -E 'status:|^[a-z].*IN|timed out|no servers' || true
              done
            done
          done
          echo "== reg.ru NS reachability"; for ip in 194.58.117.11 176.99.13.11 194.58.117.12 176.99.13.12; do dig +time=5 +tries=1 @$ip generator-nomerov.ru A +short || echo "$ip FAIL"; done
          echo "== tcp"; dig +tcp +time=5 @ns1.reg.ru generator-nomerov.ru A +short || echo tcp fail
          echo "== trace"; dig +trace +time=5 generator-nomerov.ru A | tail -15
