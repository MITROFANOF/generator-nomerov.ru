<style>
  :root {
    --bg: #0b0b10;
    --surface: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f4f4f7;
    --muted: #9a9aa8;
    --accent: #4fd1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text);
    line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header.top { padding: 20px 0; }
  header.top a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header.top a:hover { color: var(--text); }
  h1 { font-family: Unbounded, Inter, sans-serif; font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1.1;
    letter-spacing: -0.02em; margin: 8px 0 0; }
  .meta { color: var(--muted); margin: 8px 0 0; font-size: 15px; min-height: 1.5em; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .seg { display: inline-flex; gap: 4px; padding: 4px; margin: 22px 0 0; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--border); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 999px;
    font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .tabs button { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px;
    border-radius: 999px; font-size: 14px; font-weight: 600; }
  .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .note { color: var(--muted); text-align: center; margin: 40px 0 12px; }
  .more { display: block; margin: 12px auto 0; background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 9px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .more:hover { border-color: rgba(79, 209, 255, .5); }

  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; margin: 22px 0 8px; }
  .podium__step { text-align: center; min-width: 0; }
  /* The DOM runs 1, 2, 3 (a screen reader hears the winner first); the eye sees 2, 1, 3. */
  .podium__step--1 { order: 2; }
  .podium__step--2 { order: 1; }
  .podium__step--3 { order: 3; }
  .podium__name { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .podium__block { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 12px;
    border-radius: 14px 14px 0 0; }
  .podium__step--1 .podium__block { min-height: 124px; background: rgba(255, 194, 61, .16); }
  .podium__step--2 .podium__block { min-height: 100px; background: rgba(201, 201, 210, .13); }
  .podium__step--3 .podium__block { min-height: 84px; background: rgba(217, 160, 102, .15); }
  .podium__place { font-family: Unbounded, Inter, sans-serif; font-weight: 800; font-size: 24px; line-height: 1; }
  .podium__step--1 .podium__place { color: #ffc23d; font-size: 30px; }
  .podium__step--2 .podium__place { color: #c9c9d2; }
  .podium__step--3 .podium__place { color: #d9a066; }
  .podium .val { font-size: clamp(11px, 3.1vw, 14px); color: var(--muted); max-width: 100%; }
  .podium .val--best { flex-direction: column; gap: 4px; }
  .podium .price { font-size: inherit; }
  .podium .plate { font-size: 10px; max-width: 100%; }

  .rows { list-style: none; margin: 8px 0 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .row__place { width: 32px; flex-shrink: 0; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .val { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .val--best { display: flex; align-items: center; gap: 10px; }
  .price { color: var(--muted); font-size: 14px; }
  .reward { color: #6fdc8c; font-size: 13px; white-space: nowrap; }

  .card { margin: 20px 0 0; padding: 18px 16px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); }
  .card__title { font-family: Unbounded, Inter, sans-serif; font-weight: 600; font-size: 18px; margin: 0; }
  .card__caption { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .chip { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 5px 12px;
    border-radius: 999px; font-size: 13px; font-weight: 600; }
  .chip--on { border-color: var(--accent); color: var(--accent); }

  /* Номера нарисованы вёрсткой, как на главной; размер задаёт font-size плашки. */
  .plate { display: inline-flex; align-items: stretch; height: 2em; font-size: 14px; background: #fff; color: #111;
    border: .14em solid #111; border-radius: .3em; font-family: "Roboto Condensed", "Arial Narrow", sans-serif;
    font-weight: 600; line-height: 1; white-space: nowrap; overflow: hidden; }
  .plate__num { display: flex; align-items: baseline; gap: .2em; padding: 0 .35em; font-size: 1.3em; line-height: 1.4; }
  .plate__num small { font-size: .8em; }
  .plate__reg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .05em;
    border-left: .14em solid currentColor; padding: 0 .3em; min-width: 2em; }
  .plate__reg b { font-size: 1em; }
  .plate__reg i { font-style: normal; font-size: .45em; display: flex; align-items: center; gap: .25em; }
  .plate__reg i.flag::after { content: ""; width: 1.4em; height: .9em; border: 1px solid #999;
    background: linear-gradient(#fff 33%, #1c57c9 33% 66%, #d52b1e 66%); }
  .plate__band { display: flex; align-items: flex-end; padding: 0 .3em .2em; font-size: .6em; font-weight: 600; }
  .plate--police { background: #1b4fb6; color: #fff; border-color: #fff; }
  .plate--taxi { background: #f5c400; }
  .plate--army { background: #111; color: #fff; border-color: #fff; }
  .plate--diplo { background: #c8102e; color: #fff; border-color: #fff; }
  .plate--ua .plate__band { background: #1c57c9; color: #fff; }
  .plate--kz .plate__band { background: #00afca; color: #fff; }

  .about { color: var(--muted); font-size: 14px; margin: 32px 0 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 0; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; font-weight: 600;
    font-size: 15px; text-decoration: none; border: 1px solid var(--border); color: var(--text); }
  .btn:hover { border-color: rgba(79, 209, 255, .5); background: rgba(79, 209, 255, .08); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  footer { margin: 64px auto 0; max-width: 760px; padding: 24px 16px 32px; display: flex; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }

  @media (max-width: 520px) {
    .row .val--best { flex-direction: column; align-items: flex-end; gap: 4px; }
    .podium__name { font-size: 13px; }
    .seg button { padding: 8px 14px; }
  }
</style>
